name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir work
          unzip -q FpsBoost.zip -d work
          DIR=$(dirname "$(find work -name settings.gradle.kts | head -1)")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" FpsHelper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FpsHelper-apk
          path: FpsHelper.apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" FpsHelper.apk \
            --title "FPS Helper v1.0.${{ github.run_number }}" --generate-notes
